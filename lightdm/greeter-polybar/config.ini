include-file = ./colors.ini
include-file = ./modules/date.ini
include-file = ./modules/spacer.ini
include-file = ./modules/cpu.ini
include-file = ./modules/backlight.ini
include-file = ./modules/pulseaudio.ini
include-file = ./modules/battery.ini

[settings]
pseudo-transparency = true

[bar/base]
monitor = ${env:MONITOR:}
height = 28
bottom = false
fixed-center = false
override-redirect = true
locale = en_US.UTF-8
enable-ipc = true
background = ${colors.bg-transparent}
foreground = ${colors.fg}
line-size = 0
radius = 6
border-size = 1
border-color = ${colors.bar-border}
padding = 0
font-0 = "JetBrainsMono Nerd Font Mono:style=Regular:size=10;2"
font-1 = "JetBrainsMono Nerd Font Mono:style=Regular:size=14;3"
font-2 = "JetBrainsMono Nerd Font Mono:style=Regular:size=17;4"
cursor-click = pointer
cursor-scroll = ns-resize

[bar/left]
inherit = bar/base
width = ${env:LEFT_BAR_WIDTH:400}
offset-x = ${env:LEFT_BAR_OFFSET:4}
offset-y = 6
background = ${colors.bar-bg}
padding-left = 4
padding-right = 4
module-margin = 0
modules-left = date

[bar/center]
inherit = bar/base
width = ${env:CENTER_BAR_WIDTH:400}
offset-x = ${env:CENTER_BAR_OFFSET:598}
offset-y = 6
background = ${colors.bar-bg}
padding-left = 4
padding-right = 4
module-margin = 0
modules-center = spacer

[bar/right]
inherit = bar/base
width = ${env:RIGHT_BAR_WIDTH:310}
offset-x = ${env:RIGHT_BAR_OFFSET:1052}
offset-y = 6
background = ${colors.bar-bg}
padding-left = 4
padding-right = 4
module-margin = 0
modules-center = cpu backlight pulseaudio battery
