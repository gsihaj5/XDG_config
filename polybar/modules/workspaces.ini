[module/ws-base]
type = custom/script
interval = 0.5
format = <label>
label-font = 3
format-padding = 1

[module/ws1]
inherit = module/ws-base
exec = ~/.config/polybar/scripts/ws-color.sh 1
label = %{F%output%}󰆍%{F-}
click-left = i3-msg workspace number 1

