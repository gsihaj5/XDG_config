[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "󰂄"
format-charging-prefix-font = 2
format-charging-prefix-spacing = 3px
format-charging-foreground = ${colors.fg}
format-charging-margin = 0 8px
format-charging-padding = 1

format-discharging = <label-discharging>
format-discharging-prefix = "󰁾"
format-discharging-prefix-font = 2
format-discharging-prefix-spacing = 3px
format-discharging-foreground = ${colors.fg}
format-discharging-margin = 0 8px
format-discharging-padding = 1

format-full = <label-full>
format-full-prefix = "󰁹"
format-full-prefix-font = 2
format-full-prefix-spacing = 3px
format-full-foreground = ${colors.fg}
format-full-margin = 0 8px
format-full-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
