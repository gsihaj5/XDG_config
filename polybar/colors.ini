[colors]
; fully transparent bar chrome
bg-transparent = #00000000

; floating segment backgrounds (~45% opacity)
bar-bg = #731d2021
bar-bg-alt = #733c3836

; subtle outline using dim foreground
bar-border = #66a89984

fg = #ebdbb2
fg-dim = #a89984

blue = #83a598
cyan = #8ec07c
green = #b8bb26
orange = #fe8019
purple = #d3869b
red = #fb4934
yellow = #fabd2f

; semi-transparent status pill backgrounds (~55% opacity)
bg-blue = #73458588
bg-cyan = #73689d6a
bg-green = #7398971a
bg-orange = #73d65d0e
bg-purple = #73b16286
bg-red = #73cc241d
bg-yellow = #73d79921
bg-teal = #73427b58

black = #000000
white = #fbf1c7

pill-padding = 3
pill-margin = 4
