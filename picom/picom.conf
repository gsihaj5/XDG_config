# Rounded corners for floating polybar segments

corner-radius = 1

corner-radius-rules = [
  "12:class_g = 'Polybar'"
];

shadow-radius = 10;
shadow-opacity = 0.2;
shadow-offset-x = 0;
shadow-offset-y = 3;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

backend = "glx";
vsync = true;

wintypes:
{
  dock = { shadow = true; };
};
