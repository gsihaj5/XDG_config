[module/temperature]
type = internal/temperature
thermal-zone = 4
warn-threshold = 80

format = <label>
format-prefix = "󰈸 "
format-prefix-font = 3
format-background = ${colors.bg-orange}
format-foreground = ${colors.fg}
format-padding = 1

format-warn = <label-warn>
format-warn-prefix = "󰈸 "
format-warn-prefix-font = 3
format-warn-background = ${colors.bg-red}
format-warn-foreground = ${colors.fg}

label = %temperature-c%
label-warn = %temperature-c%
