[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-font = 3
format-charging-background = ${colors.bg-green}
format-charging-foreground = ${colors.fg}
format-charging-padding = 1

format-discharging = <label-discharging>
format-discharging-prefix = "󰁾 "
format-discharging-prefix-font = 3
format-discharging-background = ${colors.bg-green}
format-discharging-foreground = ${colors.fg}
format-discharging-padding = 1

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-font = 3
format-full-background = ${colors.bg-green}
format-full-foreground = ${colors.fg}
format-full-padding = 1

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
