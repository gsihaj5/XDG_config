# Small rounded corners for windows and floating polybar segments

corner-radius = 6;

rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

shadow-radius = 10;
shadow-opacity = 0.2;
shadow-offset-x = 0;
shadow-offset-y = 3;

# Quick but visible open/close fades
fading = true;
fade-in-step = 0.025;
fade-out-step = 0.025;
fade-delta = 4;

# Subtle focus transitions between windows
inactive-opacity = 0.97;
inactive-opacity-override = true;

backend = "glx";
vsync = true;

wintypes:
{
  dock = { shadow = true; fade = false; };
  menu = { fade = false; };
  popup_menu = { fade = false; };
  dropdown_menu = { fade = false; };
  tooltip = { fade = false; };
  notification = { fade = false; };
};
